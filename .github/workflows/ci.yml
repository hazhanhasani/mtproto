name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: node --check src/index.js
      - run: node --check src/vendor/telegram_webproxy.js
      - run: node --check scripts/setup.mjs
      - run: node --check scripts/publish-secrets.mjs
      - run: node --check scripts/probe.mjs
