name: VPS Control Plane CI
on:
  push:
    branches: [main]
    paths: ["vps/**", ".github/workflows/vps-ci.yml"]
  pull_request:
    paths: ["vps/**", ".github/workflows/vps-ci.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r vps/requirements.txt
      - run: python -m compileall -q vps
      - run: bash -n vps/bootstrap.sh vps/install.sh vps/update.sh vps/fetch-telegram-config.sh
      - run: python -m unittest discover -s vps/tests -v
